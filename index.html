<title>Звіт вильоту</title>
<style>
:root{--bg:#f3f4f1;--card:#fff;--ink:#1b1f1c;--muted:#6b726d;--line:#d9ddd8;--acc:#1f6b45;--acc2:#e7f1ea}
@media (prefers-color-scheme:dark){:root{--bg:#111412;--card:#1b201d;--ink:#e9ece9;--muted:#9aa29c;--line:#2e3531;--acc:#3fae73;--acc2:#1d2c23}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 90px)}
header{padding:14px 16px 6px}
h1{font-size:20px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:7px 13px;font-size:14px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);margin:8px 16px;border-radius:14px;padding:4px 14px;border:1px solid var(--line)}
.row{padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-family:inherit}
textarea{min-height:64px;resize:vertical}
.sel{display:flex;gap:6px}.sel select{flex:1}
.sm{flex:none;width:42px;border:1px solid var(--line);background:var(--acc2);color:var(--acc);border-radius:9px;font-size:20px}
.coord{display:flex;gap:6px}.coord input:first-child{flex:0 0 34%}
.vid{display:flex;align-items:center;gap:10px}
.vid .btn{flex:none}
.vname{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:0;border-radius:11px;padding:12px 14px;font-size:16px;font-weight:600;background:var(--acc2);color:var(--acc)}
pre{white-space:pre-wrap;font:14px/1.4 ui-monospace,Menlo,monospace;margin:10px 0}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg);border-top:1px solid var(--line)}
.bar .btn{flex:1}.bar .main{background:#25a35a;color:#fff}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:.95}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0007}
.it{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.it button{border:0;background:none;color:#c0392b;font-size:15px}
.hint{font-size:13px;color:var(--muted);margin:6px 16px}
</style>
</head>
<body>
<header><h1>Звіт</h1></header>
<div class="tabs" id="tabs"></div>
<div class="card" id="form"></div>
<div class="card"><div class="row"><label>Відео</label>
<div class="vid"><button class="btn" id="pick">Обрати відео</button><span class="vname" id="vname">не обрано</span></div>
<input type="file" id="file" accept="video/*" hidden></div></div>
<div class="card"><pre id="out"></pre></div>
<p class="hint">Під час надсилання текст копіюється автоматично. Якщо WhatsApp не підставив його до відео — затисніть поле підпису й натисніть «Вставити».</p>
<div class="bar"><button class="btn" id="copy">Копіювати</button><button class="btn main" id="send">Надіслати у WhatsApp</button></div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><b id="dlgT"></b><div id="dlgL" style="margin:10px 0"></div>
<div style="display:flex;gap:6px"><input id="dlgI" placeholder="Новий варіант"><button class="btn" id="dlgA">+</button></div>
<button class="btn" style="width:100%;margin-top:10px" id="dlgC">Готово</button></dialog>
<script>
const LISTS=['Екіпаж','Засіб','Ціль','Район виконання','БК'];
const T={d:'date',t:'time',s:'select',x:'text',c:'coord',a:'area'};
const REPORTS={
 'Виліт':[['Дата','d'],['Час','t'],['Екіпаж','s'],['Позиція','x'],['Ведучий','x'],['Засіб','s'],['АКБ','x'],['Виліт','x'],['Котушка','x'],['Ціль','s'],['Район виконання','s'],['Зона відповідальності','x'],['Координати','c'],['Підсвітка','x'],['БК','s'],['Відстань','x'],['Результат','a'],['Коментар','a']],
 'Прибуття':[['Дата','d'],['Час','t'],['Екіпаж','s'],['Позиція','x'],['Координати','c'],['Коментар','a']],
 'Вибуття':[['Дата','d'],['Час','t'],['Екіпаж','s'],['Позиція','x'],['Коментар','a']],
 'Відсутність вильотів':[['Дата','d'],['Час','t'],['Екіпаж','s'],['Позиція','x'],['Причина','a']],
 'Обстріл':[['Дата','d'],['Час','t'],['Екіпаж','s'],['Позиція','x'],['Координати','c'],['Чим обстріляли','x'],['Наслідки','a'],['Коментар','a']],
 'Надзвичайна подія':[['Дата','d'],['Час','t'],['Екіпаж','s'],['Позиція','x'],['Координати','c'],['Що сталося','a'],['Наслідки','a']]
};
const ls={get(k,d){try{const v=localStorage.getItem('zvit_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('zvit_'+k,JSON.stringify(v))}catch(e){}}};
let type=ls.get('type','Виліт'), vals={}, video=null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
const now=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const sticky=['Екіпаж','Позиція','Ведучий','Засіб','Район виконання','Зона відповідальності','БК'];

function renderTabs(){$('tabs').innerHTML='';Object.keys(REPORTS).forEach(k=>{const b=document.createElement('button');b.textContent=k;if(k===type)b.className='on';b.onclick=()=>{type=k;ls.set('type',k);renderTabs();renderForm()};$('tabs').appendChild(b)})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderForm(){
 const f=$('form');f.innerHTML='';
 REPORTS[type].forEach(([name,k])=>{
  const r=document.createElement('div');r.className='row';
  let v=vals[name]; if(v==null){v=k==='d'?today():k==='t'?now():sticky.includes(name)?ls.get('last_'+name,''):'';vals[name]=v}
  let h='<label>'+esc(name)+'</label>';
  if(k==='s'){const opts=ls.get('list_'+name,[]);h+='<div class="sel"><select data-n="'+esc(name)+'"><option value="">—</option>'+opts.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select><button class="sm" data-e="'+esc(name)+'">✎</button></div>'}
  else if(k==='c'){h+='<div class="coord"><input id="cpre" value="'+esc(ls.get('cprefix','37U CP'))+'" autocapitalize="characters"><input data-n="'+esc(name)+'" value="'+esc(v)+'" inputmode="numeric" placeholder="12345 67890"></div>'}
  else if(k==='a'){h+='<textarea data-n="'+esc(name)+'">'+esc(v)+'</textarea>'}
  else h+='<input data-n="'+esc(name)+'" value="'+esc(v)+'"'+(k==='t'?' inputmode="numeric"':'')+'>';
  r.innerHTML=h;f.appendChild(r)});
 f.querySelectorAll('[data-n]').forEach(el=>el.addEventListener('input',()=>{const n=el.dataset.n;vals[n]=el.value;if(sticky.includes(n))ls.set('last_'+n,el.value);update()}));
 f.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editList(b.dataset.e));
 const cp=$('cpre');if(cp)cp.oninput=()=>{ls.set('cprefix',cp.value);update()};
 update()}
function text(){return REPORTS[type].map(([n,k])=>{let v=vals[n]||'';if(k==='c'&&v.trim())v=(ls.get('cprefix','37U CP')+' '+v).trim();return n+': '+v}).join('\n')}
function update(){$('out').textContent=type.toUpperCase()+'\n'+text()}
function full(){return $('out').textContent}

let curList='';
function editList(n){curList=n;$('dlgT').textContent=n;drawList();$('dlg').showModal()}
function drawList(){const a=ls.get('list_'+curList,[]);$('dlgL').innerHTML=a.length?'':'<span class="vname">Список порожній</span>';a.forEach((o,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML='<span>'+esc(o)+'</span><button>Видалити</button>';d.querySelector('button').onclick=()=>{a.splice(i,1);ls.set('list_'+curList,a);drawList()};$('dlgL').appendChild(d)})}
$('dlgA').onclick=()=>{const v=$('dlgI').value.trim();if(!v)return;const a=ls.get('list_'+curList,[]);if(!a.includes(v))a.push(v);ls.set('list_'+curList,a);$('dlgI').value='';drawList()};
$('dlgC').onclick=()=>{$('dlg').close();renderForm()};

$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{video=e.target.files[0]||null;$('vname').textContent=video?video.name+' · '+(video.size/1048576).toFixed(1)+' МБ':'не обрано'};

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function copy(s){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(s).catch(fallback);fallback();function fallback(){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}}
$('copy').onclick=()=>{copy(full());toast('Скопійовано')};
$('send').onclick=()=>{
 const s=full(); copy(s);
 if(video){
  const data={files:[video],text:s};
  if(navigator.canShare&&navigator.canShare(data)){navigator.share(data).then(()=>newReport()).catch(e=>{if(e.name!=='AbortError')toast('Не вдалося: '+e.message)})}
  else toast('Цей браузер не вміє надсилати відео. Відкрийте в Safari.');
 } else location.href='whatsapp://send?text='+encodeURIComponent(s);
};
function newReport(){video=null;$('file').value='';$('vname').textContent='не обрано';
 REPORTS[type].forEach(([n,k])=>{if(!sticky.includes(n))delete vals[n]});renderForm()}
renderTabs();renderForm();
</script>
</body>
</html>
